[package]
name = "rho-brain"
version = "0.7.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
topcoat = { version = "0.6.0", features = ["discover", "asset", "router", "view", "datastar"] }
toasty = { version = "0.10.0", features = ["sqlite", "serde", "jiff"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.1", features = ["v4", "v7", "serde"] }
jiff = { version = "0.2.35", features = ["serde"] }
pulldown-cmark = "0.13.4"

[dev-dependencies]
bytes = "1.12.1"
http = "1.5.0"