[package]
name = "rho-brain"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
topcoat = { version = "0.4.0", features = ["discover", "asset", "router", "view"] }
toasty = { version = "0.9.0", features = ["sqlite", "serde", "jiff"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23", features = ["v4", "v7", "serde"] }
jiff = { version = "0.2", features = ["serde"] }
